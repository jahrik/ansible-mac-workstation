---
- name: Verify
  hosts: all
  gather_facts: true
  tasks:
    - name: Check Homebrew is available
      ansible.builtin.command: which brew
      register: brew_bin
      changed_when: false

    - name: Assert Homebrew is installed
      ansible.builtin.assert:
        that: brew_bin.rc == 0
        fail_msg: "brew not found on PATH"

    - name: Check git is installed via Homebrew
      ansible.builtin.command: brew list git
      register: brew_git
      changed_when: false

    - name: Assert git is installed
      ansible.builtin.assert:
        that: brew_git.rc == 0
        fail_msg: "git not installed via Homebrew"

    - name: Check zsh config
      ansible.builtin.stat:
        path: ~/.zshrc
      register: zshrc

    - name: Assert zshrc exists
      ansible.builtin.assert:
        that: zshrc.stat.exists
        fail_msg: "~/.zshrc not found"

    - name: Check nvim config
      ansible.builtin.stat:
        path: ~/.config/nvim
      register: nvim_cfg

    - name: Assert nvim config exists
      ansible.builtin.assert:
        that: nvim_cfg.stat.isdir
        fail_msg: "~/.config/nvim directory not found"

    - name: Check Claude Code global config symlink
      ansible.builtin.stat:
        path: ~/.claude/CLAUDE.md
      register: claude_md

    - name: Assert CLAUDE.md is a symlink into the agent config repo
      ansible.builtin.assert:
        that: claude_md.stat.islnk
        fail_msg: "~/.claude/CLAUDE.md not found or not a symlink"

    - name: Check Claude Code agents symlink
      ansible.builtin.stat:
        path: ~/.claude/agents
      register: claude_agents

    - name: Assert agents directory is a symlink into the agent config repo
      ansible.builtin.assert:
        that: claude_agents.stat.islnk
        fail_msg: "~/.claude/agents not found or not a symlink"
